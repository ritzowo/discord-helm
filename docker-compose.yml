services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_helm
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d discord_helm']
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    image: ${DISCORD_HELM_IMAGE:-ghcr.io/ritzowo/discord-helm}:${DISCORD_HELM_VERSION:-latest}
    env_file: ${DISCORD_HELM_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/discord_helm
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped

volumes:
  db-data:
